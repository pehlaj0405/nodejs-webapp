name: Build and Deploy to Azure Web App (Node 20 LTS)

on:
  push:
    branches:
      - main  # deploy automatically when pushing to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js 20 runtime on the runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies (same as npm install)
      - name: Install dependencies
        run: npm ci
        # you can use `npm install` instead if you don’t have a package-lock.json

      # 4️⃣ Optional build step — for React/Vue/Next apps, etc.
      - name: Build app (optional)
        run: |
          echo "No build step for this simple Node app"
          # If you had a React app, you'd use: npm run build

      # 5️⃣ Test step (optional, can be skipped)
      - name: Run tests (optional)
        run: echo "No tests configured"

      # 6️⃣ Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'testwebapp26'  # replace with your app's name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '.'
