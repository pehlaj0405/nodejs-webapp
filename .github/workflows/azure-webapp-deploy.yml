name: Deploy Node.js app to Azure Web App (Staging & Production)

on:
  workflow_run:
    workflows: ["CI - Test and Code Coverage"]  # 👈 must match exactly the 'name:' in your CI workflow
    types:
      - completed  # triggers after CI workflow completes

jobs:
  # -------------------------------
  # 🧪 STAGING DEPLOYMENT
  # -------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # 👇 Only run if the CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Optional build (if needed)
      - name: Build app (optional)
        run: |
          echo "No build step needed for basic Node app"
          # npm run build

      # 5️⃣ Deploy to Azure Web App (Staging)
      - name: Deploy to Azure Web App - Staging
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'testwebapp26'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: '.'

  # -------------------------------
  # 🚀 PRODUCTION DEPLOYMENT (requires approval)
  # -------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    # 👇 Only run if staging succeeded
    if: ${{ success() }}
    environment:
      name: production
    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Deploy to Azure Web App (Production)
      - name: Deploy to Azure Web App - Production
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'testwebapp26'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: '.'
